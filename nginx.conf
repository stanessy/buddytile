server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

  # Fingerprint-free static assets still change rarely — a week is safe
  location ~* \.(png|jpg|jpeg|webp|avif|svg|css|js|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
  }

  # Bare section directories have no index page — send visitors home
  location = /services/ {
    return 302 /;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
